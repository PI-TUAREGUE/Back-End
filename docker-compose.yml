services:
  mongo-db:
    image: mongo:latest
    container_name: mongo_tuaregue
    restart: always
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '${MONGO_PORT}:27017'
    volumes:
      - mongo_data:/data/db

  mongo-init-replica:
    image: mongo:latest
    depends_on:
      - mongo-db
    restart: 'no'
    entrypoint:
      [
        'bash',
        '-c',
        'sleep 3 && mongosh --host mongo-db:27017 --eval ''rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo-db:27017" }] })'' || true',
      ]

  app:
    build: .
    container_name: tuaregue-app
    ports:
      - '${PORT}:3000'
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo-db
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongo_data:
