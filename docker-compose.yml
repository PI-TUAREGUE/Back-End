services:
  mongo-db:
    image: mongo:latest
    container_name: mongo_tuaregue
    ports:
      - '${MONGO_PORT}:27017'
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: tuaregue-app
    ports:
      - '${PORT}:3000'
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo-db
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongo_data:
